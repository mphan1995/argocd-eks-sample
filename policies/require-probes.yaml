apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: enforce
  rules:
    - name: check-probes
      match:
        resources:
          kinds:
            - Deployment
      validate:
        message: "Containers must have liveness and readiness probes"
        pattern:
          spec:
            template:
              spec:
                containers:
                  - livenessProbe:
                      exists: true
                    readinessProbe:
                      exists: true
