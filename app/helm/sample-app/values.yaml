replicaCount: 1

image:
  repository: localhost:5000/sample-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort:

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  livenessPath: /health
  readinessPath: /health
  port: 5000
