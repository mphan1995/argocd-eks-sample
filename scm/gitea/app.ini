APP_NAME = CI_CD_LOCAL_MAX SCM
RUN_MODE = prod
RUN_USER = git

[server]
DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
SSH_DOMAIN = localhost
SSH_PORT = 222
DISABLE_SSH = false

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[security]
INSTALL_LOCK = true
SECRET_KEY = change_me_local_only
INTERNAL_TOKEN = change_me_local_only

[service]
DISABLE_REGISTRATION = true
