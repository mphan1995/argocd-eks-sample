{% extends "layout.html" %}

{% block content %}
<section class="page-header">
  <div>
    <h1>Run {{ run_id }}</h1>
    <p class="muted">Chi tiết log cho từng stage.</p>
  </div>
  <div class="actions">
    <a id="download-link" class="btn ghost" href="#">Tải artifact</a>
    <button id="btn-delete-run" class="btn danger">Delete</button>
  </div>
</section>

<div class="card">
  <div id="run-meta" class="meta"></div>
</div>

<div class="logs" id="run-logs"></div>
{% endblock %}
