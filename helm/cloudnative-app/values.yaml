replicaCount: 2

image:
  repository: 508591325080.dkr.ecr.us-east-1.amazonaws.com/cloudnative-app
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: app-sa
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

probes:
  readiness:
    path: /readyz
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
  liveness:
    path: /healthz
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2

env: []
