apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-project
  namespace: argocd
spec:
  description: Demo project for ArgoCD learning
  sourceRepos:
    - https://github.com/mphan1995/argocd-eks-sample.git
  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc

  # Cho phép tất cả namespace-level resources
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress

  # (tùy chọn) cho phép cluster-wide nếu cần
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
